name: Site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate audit reporter syntax
        run: node --check scripts/audit-summary.mjs

      - name: Summarize dependency audit findings (diagnostic only)
        continue-on-error: true
        run: node scripts/audit-summary.mjs

      - name: Install Chromium for browser and accessibility tests
        run: npx playwright install --with-deps chromium

      - name: Build and run site quality checks
        run: npm test

      - name: Smoke test Lighthouse on local home page
        run: LH_PAGES=/ LH_FORM_FACTORS=mobile node scripts/lighthouse.mjs
