name: Temporary Astro 7 migration preview
on:
  push:
    branches:
      - fix/astro7-major-security-upgrade-20261030
    paths:
      - .github/workflows/astro-upgrade-preview.yml

permissions:
  contents: read

jobs:
  resolve-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Resolve Astro 7.4.4 without changing main
        run: npm install astro@7.4.4 --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Export generated package and lock to review log
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.stringify({
            packageJson: readFileSync('package.json', 'utf8'),
            packageLock: readFileSync('package-lock.json', 'utf8'),
          });
          for (let start = 0; start < payload.length; start += 2400) {
            console.log('ASTRO_MIGRATION_PART:' + payload.slice(start, start + 2400));
          }
          NODE

      - name: Install freshly locked dependencies
        run: npm ci

      - name: Check production audit at high severity
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium for full tests
        run: npx playwright install --with-deps chromium

      - name: Verify full Astro site and generated kit files
        run: npm test

      - name: Smoke test Lighthouse after build
        run: LH_PAGES=/ LH_FORM_FACTORS=mobile node scripts/lighthouse.mjs
