# INACTIVE REFERENCE TEMPLATE. This file lives under ci/, not .github/workflows/.
# Do not activate Pages deployment without explicit review and approval.
name: CI & Deploy (inactive template)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every PR runs with read-only repository access, never a deployment token.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up supported Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test audit reporter on offline fixtures
        run: node --test scripts/audit-report-core.test.mjs

      - name: Report dependency advisories (diagnostic only)
        continue-on-error: true
        run: node scripts/audit-summary.mjs

      - name: Block vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install Chromium for accessibility and functional checks
        run: npx playwright install --with-deps chromium

      - name: Build and validate generated website
        run: npm test

      - name: Verify mobile Lighthouse quality
        run: LH_PAGES=/ LH_FORM_FACTORS=mobile node scripts/lighthouse.mjs

      - name: Upload reviewed Pages artifact (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    # Never deploy from a PR, fork, manual dispatch or non-main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - name: Deploy validated artifact to GitHub Pages
        id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
